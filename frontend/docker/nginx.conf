server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep the origin visible to the backend for CSRF enforcement.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 45s;
    proxy_request_buffering on;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # Revalidate the SPA and its asset references after each production release.
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  }
}
